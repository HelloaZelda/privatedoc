<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="8"/>

  <!-- Left Document (From) -->
  <rect x="110" y="120" width="160" height="220" rx="20" fill="#27272a" stroke="#3f3f46" stroke-width="6"/>
  <line x1="145" y1="170" x2="225" y2="170" stroke="#71717a" stroke-width="10" stroke-linecap="round"/>
  <line x1="145" y1="210" x2="205" y2="210" stroke="#71717a" stroke-width="10" stroke-linecap="round"/>
  <line x1="145" y1="250" x2="185" y2="250" stroke="#71717a" stroke-width="10" stroke-linecap="round"/>

  <!-- Right Document (To) with Glow -->
  <rect x="242" y="172" width="160" height="220" rx="20" fill="#18181b" stroke="#10b981" stroke-width="6" filter="url(#glow)"/>
  <line x1="277" y1="222" x2="357" y2="222" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>
  <line x1="277" y1="262" x2="337" y2="262" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>
  <line x1="277" y1="302" x2="317" y2="302" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>

  <!-- Dynamic Center Conversion Node / Lightning Loop -->
  <circle cx="256" cy="256" r="44" fill="#09090b" stroke="#3f3f46" stroke-width="6"/>
  <!-- Switch Arrows inside Node -->
  <path d="M236 244L266 244M266 244L254 232M266 244L254 256" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M276 268L246 268M246 268L258 280M246 268L258 256" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
